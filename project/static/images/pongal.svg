  <path d="M100 98 Q102 94 104 98" stroke="#388E3C" stroke-width="2" fill="none"/>
  <!-- Steam -->
  <path d="M75 88 Q77 78 75 68" stroke="#B0BEC5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M100 84 Q102 74 100 64" stroke="#B0BEC5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M125 88 Q127 78 125 68" stroke="#B0BEC5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="100" y="186" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#5D4037">Pongal</text>
</svg>
