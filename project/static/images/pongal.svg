  <ellipse cx="100" cy="120" rx="60" ry="12" fill="#6D4C41"/>
  <ellipse cx="100" cy="118" rx="60" ry="12" fill="#795548"/>
  <!-- Pongal rice - creamy yellow -->
  <ellipse cx="100" cy="118" rx="56" ry="10" fill="#F9A825"/>
  <ellipse cx="100" cy="112" rx="54" ry="18" fill="#FBC02D"/>
  <ellipse cx="100" cy="108" rx="52" ry="16" fill="#FFCA28"/>
  <!-- Rice texture dots -->
  <circle cx="80" cy="108" r="3" fill="#FFF9C4"/>
  <circle cx="95" cy="104" r="3" fill="#FFF9C4"/>
  <circle cx="112" cy="107" r="3" fill="#FFF9C4"/>
  <circle cx="88" cy="114" r="2.5" fill="#FFF176"/>
  <circle cx="106" cy="112" r="2.5" fill="#FFF176"/>
