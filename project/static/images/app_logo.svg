<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base App Tile (Squircle with 24% radius) -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#bgGrad)"/>

  <!-- Top Gloss Arc -->
  <path d="M 2 24 C 2 11.8 11.8 2 24 2 L 76 2 C 88.2 2 98 11.8 98 24 C 98 34 85 45 50 45 C 15 45 2 34 2 24 Z" fill="url(#glossGrad)"/>

  <!-- Decorative Inner Border -->
  <rect x="4" y="4" width="92" height="92" rx="20" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" fill="none"/>

  <!-- Logo Graphics Group with Shadow -->
  <g filter="url(#softShadow)">
    <!-- Smart Steam / WiFi Waves (Represents Smart Canteen IoT / Online) -->
    <path d="M 40 28 C 40 22 44 20 44 15" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 50 26 C 50 20 54 18 54 13" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 60 28 C 60 22 64 20 64 15" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Cloche Handle / Knob -->
    <circle cx="50" cy="36" r="4.5" fill="url(#goldGrad)"/>
    <path d="M 47.5 39.5 L 52.5 39.5 L 52 42.5 L 48 42.5 Z" fill="#FFE082"/>

    <!-- Cloche Dome Cover -->
    <path d="M 22 62 C 22 45 34 42.5 50 42.5 C 66 42.5 78 45 78 62 Z" fill="#FFFFFF"/>

    <!-- Cloche Inner Shadow / Highlight Accent -->
    <path d="M 26 60 C 29 48 38 45 50 45 C 62 45 71 48 74 60 Z" fill="#FFF5F5" opacity="0.6"/>

    <!-- Cloche Rim Base -->
    <rect x="18" y="62" width="64" height="4.5" rx="2.2" fill="url(#goldGrad)"/>

    <!-- Serving Platter / Tray -->
    <path d="M 14 69.5 C 14 68 15 67 17 67 L 83 67 C 85 67 86 68 86 69.5 C 86 71 83 72.5 78 72.5 L 22 72.5 C 17 72.5 14 71 14 69.5 Z" fill="#FFFFFF"/>

    <!-- Digital Smart Sparkle (Top-right corner) -->
    <path d="M 77 22 L 78.5 26.5 L 83 28 L 78.5 29.5 L 77 34 L 75.5 29.5 L 71 28 L 75.5 26.5 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Bold Monogram "C" subtle badge at bottom -->
  <text x="50" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" letter-spacing="2.5">CANTEX</text>
</svg>
