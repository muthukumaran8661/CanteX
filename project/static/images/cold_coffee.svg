<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#E8F5E9"/>
  <!-- Glass shadow -->
  <ellipse cx="100" cy="172" rx="32" ry="8" fill="#B0BEC5" opacity="0.5"/>
  <!-- Glass body (tall) -->
  <path d="M70 75 L75 168 L125 168 L130 75 Z" fill="#E3F2FD" opacity="0.6"/>
  <path d="M72 76 L77 167 L123 167 L128 76 Z" fill="#B3E5FC" opacity="0.4"/>
  <!-- Glass outline -->
  <path d="M70 75 L75 168 L125 168 L130 75" stroke="#90CAF9" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <!-- Coffee liquid inside -->
  <path d="M73 90 L77 165 L123 165 L127 90 Z" fill="#5D3D1E"/>
  <path d="M73 90 L127 90 L125 88 L75 88 Z" fill="#6F4728"/>
  <!-- Ice cubes -->
  <rect x="80" y="110" width="20" height="20" rx="3" fill="#E3F2FD" opacity="0.85"/>
  <rect x="100" y="115" width="20" height="18" rx="3" fill="#BBDEFB" opacity="0.85"/>
  <rect x="83" y="128" width="18" height="18" rx="3" fill="#E1F5FE" opacity="0.80"/>
  <!-- Ice cube shine lines -->
  <line x1="82" y1="113" x2="88" y2="113" stroke="white" stroke-width="1" opacity="0.8"/>
  <line x1="102" y1="118" x2="108" y2="118" stroke="white" stroke-width="1" opacity="0.8"/>
  <!-- Whipped cream on top -->
  <ellipse cx="100" cy="88" rx="26" ry="10" fill="#FFFDE7"/>
  <path d="M76 88 Q82 80 88 86 Q94 79 100 85 Q106 79 112 86 Q118 80 124 88" fill="#FFF9C4" stroke="#F5E6C8" stroke-width="1"/>
  <ellipse cx="100" cy="85" rx="18" ry="6" fill="#FFFDE7"/>
  <!-- Chocolate drizzle on cream -->
  <path d="M88 82 Q95 78 102 82" stroke="#8B4513" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M84 85 Q100 79 116 85" stroke="#6B3410" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Straw -->
  <rect x="116" y="55" width="7" height="120" rx="3.5" fill="#FF7043" transform="rotate(5,119,115)"/>
  <rect x="117" y="56" width="5" height="118" rx="2.5" fill="#FF8A65" transform="rotate(5,119,115)"/>
  <!-- Straw stripes -->
  <rect x="116" y="70" width="7" height="8" rx="0" fill="#FF5722" transform="rotate(5,119,74)"/>
  <rect x="116" y="90" width="7" height="8" rx="0" fill="#FF5722" transform="rotate(5,119,94)"/>
  <rect x="116" y="110" width="7" height="8" rx="0" fill="#FF5722" transform="rotate(5,119,114)"/>
  <!-- Coffee bean garnish -->
  <ellipse cx="96" cy="83" rx="4" ry="2.5" fill="#4E2500" transform="rotate(-20,96,83)"/>
  <line x1="93" y1="83" x2="99" y2="83" stroke="#6F3500" stroke-width="0.8" transform="rotate(-20,96,83)"/>
  <text x="100" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5D4037">Cold Coffee</text>
</svg>
