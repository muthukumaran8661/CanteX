  <path d="M110 72 Q112 62 110 52" stroke="#BDBDBD" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="100" y="184" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5D4037">Masala Dosa</text>
