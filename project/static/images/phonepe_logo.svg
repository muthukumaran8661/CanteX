<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40" fill="none">
  <!-- Purple Circle with white "पे" -->
  <circle cx="18" cy="20" r="17" fill="#5f259f"/>
  <!-- Devanagari "पे" glyph (drawn with precise vector path) -->
  <g fill="#ffffff">
    <!-- Top shirorekha bar -->
    <rect x="8.5" y="10.5" width="19" height="2.2" rx="0.5"/>
    <!-- Matra slant on top -->
    <path d="M 20.2 10.7 L 17.5 4.5 C 17.2 3.8 17.6 3.2 18.3 3.4 C 18.8 3.5 19.3 3.8 21.6 8.5 L 22.8 10.7 Z"/>
    <!-- Vertical stem of 'Pa' -->
    <rect x="21" y="11.5" width="2.4" height="15" rx="0.4"/>
    <!-- Curve of 'Pa' -->
    <path d="M 12.5 11.5 L 12.5 18 C 12.5 20.8 14.5 22.2 17.8 22.2 L 21.5 22.2 L 21.5 20 L 17.8 20 C 15.6 20 14.7 19.2 14.7 17.8 L 14.7 11.5 Z"/>
  </g>
  <!-- "PhonePe" text -->
  <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b1b1b" letter-spacing="-0.4">PhonePe</text>
</svg>
