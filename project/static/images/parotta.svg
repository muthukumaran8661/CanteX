<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#FFF3E0"/>
  <!-- Plate -->
  <ellipse cx="100" cy="160" rx="72" ry="16" fill="#EEEEEE"/>
  <ellipse cx="100" cy="158" rx="72" ry="16" fill="#F5F5F5"/>
  <!-- Parotta stack - layered flaky bread -->
  <!-- Bottom parotta -->
  <ellipse cx="100" cy="155" rx="60" ry="12" fill="#D4870D"/>
  <ellipse cx="100" cy="150" rx="60" ry="12" fill="#E08010"/>
  <!-- Layer lines on bottom -->
  <path d="M50 150 Q100 146 150 150" stroke="#BF6B00" stroke-width="1.5" fill="none"/>
  <!-- Middle parotta -->
  <ellipse cx="100" cy="140" rx="58" ry="12" fill="#E8920A"/>
  <ellipse cx="100" cy="135" rx="58" ry="12" fill="#F0A010"/>
  <!-- Layer lines middle -->
  <path d="M52 135 Q100 131 148 135" stroke="#C67D00" stroke-width="1.5" fill="none"/>
  <!-- Top parotta -->
  <ellipse cx="100" cy="125" rx="56" ry="12" fill="#F5A820"/>
  <ellipse cx="100" cy="120" rx="56" ry="12" fill="#FFBB33"/>
  <!-- Flaky top surface texture -->
  <path d="M56 120 Q70 116 84 120" stroke="#E09000" stroke-width="1.5" fill="none"/>
  <path d="M86 118 Q100 114 114 118" stroke="#E09000" stroke-width="1.5" fill="none"/>
  <path d="M116 120 Q130 116 144 120" stroke="#E09000" stroke-width="1.5" fill="none"/>
  <!-- Ghee sheen -->
  <ellipse cx="100" cy="118" rx="30" ry="10" fill="#FFE082" opacity="0.5"/>
  <!-- Spiral center -->
  <circle cx="100" cy="118" r="8" fill="#FFD54F"/>
  <circle cx="100" cy="118" r="5" fill="#FFC107"/>
  <circle cx="100" cy="118" r="2" fill="#FF8F00"/>
  <!-- Curry side dish -->
  <path d="M155 140 Q158 130 168 130 Q178 130 178 140 Q178 155 168 158 Q158 158 155 148 Z" fill="#E65100"/>
  <path d="M157 140 Q160 132 168 132 Q176 132 176 140 Q176 153 168 156 Q160 156 157 148 Z" fill="#FF7043"/>
  <ellipse cx="168" cy="131" rx="10" ry="5" fill="#FF5722"/>
  <!-- Curry sauce drip -->
  <path d="M100 120 Q96 128 98 136" stroke="#FF6D00" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <text x="100" y="183" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#5D4037">Parotta</text>
</svg>
